name: Build and Deploy to OVH

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Deploy via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./dist/
          server-dir: /www/
          dangerous-clean-slate: false

      - name: Ping IndexNow (Bing, Yandex)
        if: success()
        run: |
          KEY=434f8e28e564afd75ff290e234154507
          URLS=$(cat dist/sitemap-*.xml | grep -o '<loc>[^<]*</loc>' | sed 's/<[^>]*>//g' | grep -v 'sitemap-')
          echo "$URLS" | jq -R -s -c 'split("\n") | map(select(length > 0)) | _nwise(1000)' | while read -r BATCH; do
            curl -s -o /dev/null -w "IndexNow %{http_code}\n" -X POST https://api.indexnow.org/IndexNow \
              -H "Content-Type: application/json; charset=utf-8" \
              -d "{\"host\":\"arabiaexpat.com\",\"key\":\"$KEY\",\"keyLocation\":\"https://arabiaexpat.com/$KEY.txt\",\"urlList\":$BATCH}" || true
          done
